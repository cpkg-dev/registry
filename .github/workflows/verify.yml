name: Verify Package Submission

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Submission Details
        id: extract
        run: |
          BODY="${{ github.event.pull_request.body }}"

          # Extract Source URL, trimming leading/trailing spaces or markdown bullet artifacts
          URL=$(echo "$BODY" | grep -oP '(?<=\*\*Source URL:\*\* ).*' | tr -d '\r' | xargs)

          # Match the exact label used in your PR template: "**Verification Hash:**"
          EXPECTED_HASH=$(echo "$BODY" | grep -oP '(?<=\*\*Verification Hash:\*\* ).*' | tr -d '\r' | xargs)

          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "expected_hash=$EXPECTED_HASH" >> $GITHUB_OUTPUT

      - name: Download and Verify Package
        run: |
          echo "Downloading from: ${{ steps.extract.outputs.url }}"
          curl -sL "${{ steps.extract.outputs.url }}" -o package.tar.gz

          ACTUAL_HASH=$(sha256sum package.tar.gz | awk '{print $1}')
          EXPECTED="${{ steps.extract.outputs.expected_hash }}"

          echo "Expected Hash: $EXPECTED"
          echo "Actual Hash:   $ACTUAL_HASH"

          if [ "$ACTUAL_HASH" != "$EXPECTED" ]; then
            echo "Hash mismatch!"
            exit 1
          fi
          echo "Hash verification passed."
